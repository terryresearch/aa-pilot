<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Research Study</title>
<style>
  :root{
    --bg:#FBFAF8; --surface:#FFFFFF; --ink:#18181B; --ink2:#3F3F46;
    --muted:#71717A; --line:#E4E4E7; --line2:#D4D4D8;
    --accent:#115E67; --accent-dk:#0C464D; --accent-soft:#E8F1F2;
    --user-bub:#F4F4F5; --warn:#9A3412;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:17px; line-height:1.62; -webkit-font-smoothing:antialiased;
  }
  #bar{position:fixed;top:0;left:0;height:3px;width:0%;background:var(--accent);transition:width .35s ease;z-index:50}
  .wrap{max-width:760px;margin:0 auto;padding:64px 28px 120px}
  h1{font-size:29px;line-height:1.25;font-weight:650;letter-spacing:-.015em;margin:0 0 20px}
  h2{font-size:21px;line-height:1.3;font-weight:640;letter-spacing:-.01em;margin:34px 0 12px}
  p{margin:0 0 16px;color:var(--ink2)}
  .lead{font-size:18px;color:var(--ink2)}
  .muted{color:var(--muted);font-size:15px}
  .kicker{font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);font-weight:660;margin-bottom:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 28px;margin:0 0 22px}

  /* ---------- buttons ---------- */
  .btn{
    appearance:none;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;
    padding:13px 30px;border-radius:9px;cursor:pointer;transition:background .15s ease, transform .05s ease;
  }
  .btn:hover{background:var(--accent-dk)}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{background:var(--line2);color:#fff;cursor:not-allowed}
  .btn-row{margin-top:34px;display:flex;align-items:center;gap:18px}
  .err{color:var(--warn);font-size:15px;margin-top:14px;display:none}
  .err.show{display:block}

  /* ---------- question ---------- */
  .q{margin:0 0 30px;padding:0 0 4px}
  .q:last-of-type{margin-bottom:8px}
  .qtext{font-size:17.5px;line-height:1.5;margin:0 0 14px;color:var(--ink)}
  .qnum{color:var(--accent);font-weight:650;margin-right:8px;font-variant-numeric:tabular-nums}

  /* ---------- likert ---------- */
  .lik{display:flex;gap:6px;margin:4px 0 6px}
  .lik label{
    flex:1;position:relative;height:46px;border:1.5px solid var(--line2);border-radius:8px;
    cursor:pointer;background:var(--surface);transition:border-color .12s ease;user-select:none;
  }
  .lik label:hover{border-color:var(--accent)}
  .lik input{position:absolute;opacity:0;width:0;height:0}
  .lik .n{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    border-radius:6.5px;font-size:15px;font-weight:560;color:var(--ink2);
    transition:background .12s ease,color .12s ease;
  }
  .lik label:hover .n{background:var(--accent-soft)}
  .lik input:checked + .n{background:var(--accent);color:#fff;font-weight:640}
  .anchors{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:2px}

  /* ---------- choice / checkbox ---------- */
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border:1.5px solid var(--line2);
    border-radius:9px;cursor:pointer;background:var(--surface);transition:all .12s ease;font-size:16px;
  }
  .opt:hover{border-color:var(--accent);background:var(--accent-soft)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .opt input{margin:5px 0 0 0;accent-color:var(--accent);width:16px;height:16px;flex:0 0 auto}

  textarea,input[type=number]{
    width:100%;font:inherit;padding:13px 15px;border:1.5px solid var(--line2);border-radius:9px;
    background:var(--surface);color:var(--ink);resize:vertical;
  }
  textarea:focus,input:focus{outline:none;border-color:var(--accent)}
  input[type=number]{max-width:160px}

  /* ---------- CHAT MOCKUP ---------- */
  .chat{
    border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.12);margin:6px 0 26px;
  }
  .chat-top{
    display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid var(--line);
    background:#FCFCFC;
  }
  .chat-dot{width:8px;height:8px;border-radius:50%;background:#22C55E;flex:0 0 auto}
  .chat-name{font-size:13.5px;font-weight:620;color:var(--ink2);letter-spacing:.01em}
  .chat-body{padding:20px 20px 22px}
  .turn{margin:0 0 18px}
  .turn:last-child{margin-bottom:0}
  .u-row{display:flex;justify-content:flex-end}
  .u-bub{
    background:var(--user-bub);border-radius:16px 16px 5px 16px;padding:11px 16px;
    max-width:80%;font-size:15.5px;line-height:1.5;color:var(--ink);
  }
  .a-row{display:flex;gap:12px;align-items:flex-start;margin-top:16px}
  .a-av{
    width:27px;height:27px;border-radius:7px;flex:0 0 auto;background:var(--accent);
    display:flex;align-items:center;justify-content:center;margin-top:2px;
  }
  .a-av svg{width:15px;height:15px;fill:#fff}
  .a-txt{font-size:15.3px;line-height:1.66;color:var(--ink);padding-top:1px}
  .a-txt p{margin:0 0 11px;color:var(--ink)}
  .a-txt p:last-child{margin-bottom:0}
  .gap{
    display:flex;align-items:center;gap:12px;margin:22px 0 4px;
  }
  .gap::before,.gap::after{content:"";flex:1;height:1px;background:var(--line)}
  .gap span{font-size:12.5px;color:var(--muted);white-space:nowrap;letter-spacing:.02em}

  .note{background:var(--accent-soft);border-radius:10px;padding:15px 18px;font-size:15.5px;color:var(--ink2);margin:0 0 26px}
  /* ---------- split layout for vignette screens ---------- */
  .wrap.wide{max-width:1220px}
  .vhead{margin:0 0 22px}
  .vsplit{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:38px;align-items:start}
  .vleft{position:sticky;top:22px;max-height:calc(100vh - 44px);overflow-y:auto;overscroll-behavior:contain}
  .vleft::-webkit-scrollbar{width:9px}
  .vleft::-webkit-scrollbar-thumb{background:#D7DCE2;border-radius:5px}
  .vright{min-height:60vh}
  .waiting{
    border:1.5px dashed var(--line2);border-radius:12px;padding:30px 26px;color:var(--muted);
    font-size:15.5px;line-height:1.6;background:#FCFCFB;
  }
  .askbtn{
    display:inline-flex;align-items:center;gap:10px;appearance:none;border:1.5px solid var(--accent);
    background:var(--surface);color:var(--accent);font:inherit;font-weight:620;font-size:15px;
    padding:12px 22px;border-radius:9px;cursor:pointer;transition:all .14s ease;margin:6px 0 2px;
  }
  .askbtn:hover{background:var(--accent);color:#fff}
  .askbtn[disabled]{opacity:.4;cursor:not-allowed;border-color:var(--line2);color:var(--muted);background:var(--surface)}
  .askwrap{display:flex;justify-content:center;padding:14px 0 2px}
  .qhide{display:none}
  .qshow{display:block;animation:qfade .3s ease}
  @keyframes qfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .readnote{
    display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:10px;
    padding:15px 18px;font-size:15.5px;color:var(--ink2);margin:0 0 26px;
  }
  .rdot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:0 0 auto;
        animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  .qstep{font-size:13px;color:var(--muted);margin:0 0 26px;letter-spacing:.02em}
  .blk{display:none}
  .blk.on{display:block}
  .center{text-align:center}
  code.cc{
    display:inline-block;background:var(--ink);color:#fff;padding:9px 20px;border-radius:8px;
    font-size:19px;letter-spacing:.09em;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (max-width:1180px){ .vsplit{gap:26px} .wrap.wide{max-width:100%;padding-left:24px;padding-right:24px} }
  @media (max-width:820px){ .wrap{padding:40px 20px 90px} }
</style>
</head>
<body>
<div id="bar"></div>
<div class="wrap" id="app"></div>

<script>
/* =====================================================================
   ANSWER ARBITRARINESS — PILOT SURVEY
   Single-group survey. One counterbalanced factor: block order.
   ===================================================================== */
const CONFIG = {
  study:   "answer_arbitrariness_pilot",
  version: "v1.0",
  supabaseUrl: "https://dzqjhdhyrzdudlqvqmjq.supabase.co",
  supabaseKey: "sb_publishable_bVhnW3Zku3IIS_yj-YjUZw_FX2xYBBu",
  table:  "aa_responses",
  events: "aa_events",
  rpc:    "aa_assign_condition",
  completionCode: "C140L4QS",
  prolificReturnUrl: "https://app.prolific.com/submissions/complete?cc=C140L4QS",
  redirectDelayMs: 15000,
  cells: ["vignettes_first","beliefs_first"]
};

/* ---------- state ---------- */
const D = {};                      // everything we record
const T = { start: Date.now(), screenStart: Date.now() };
let SUBMISSION_ID = null, SCREENS = [], idx = 0, blurCount = 0;

const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
      const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16);}));

/* seeded PRNG so a participant's shuffles are reconstructable from their row */
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0;}}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;}}
let RNG = Math.random;
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- URL params ---------- */
const P = new URLSearchParams(location.search);
const PID = P.get("PROLIFIC_PID") || P.get("participantId") || P.get("workerId") || null;
D.PROLIFIC_PID = PID; D.pid_source = PID ? "url" : "generated";
D.STUDY_ID = P.get("STUDY_ID") || null; D.SESSION_ID = P.get("SESSION_ID") || null;

/* ---------- transport ---------- */
async function post(path, body){
  return fetch(CONFIG.supabaseUrl + "/rest/v1/" + path, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":CONFIG.supabaseKey,
              "Authorization":"Bearer "+CONFIG.supabaseKey, "Prefer":"return=minimal" },
    body: JSON.stringify(body)
  });
}
function logEvent(ev, detail){
  try{ post(CONFIG.events, { study:CONFIG.study, version:CONFIG.version,
    submission_id:SUBMISSION_ID, pid:PID, event:ev, detail:detail?String(detail).slice(0,400):null }); }catch(e){}
}
async function assignCell(){
  try{
    const r = await fetch(CONFIG.supabaseUrl + "/rest/v1/rpc/" + CONFIG.rpc, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":CONFIG.supabaseKey,
                "Authorization":"Bearer "+CONFIG.supabaseKey },
      body: JSON.stringify({ p_study:CONFIG.study, p_submission_id:SUBMISSION_ID,
                             p_pid:PID, p_cells:CONFIG.cells })
    });
    if(!r.ok) throw new Error("rpc "+r.status);
    const cell = await r.json();
    if(typeof cell !== "string" || !CONFIG.cells.includes(cell)) throw new Error("bad cell");
    D.assignment_source = "server"; return cell;
  }catch(e){
    D.assignment_source = "client_fallback";
    return CONFIG.cells[Math.floor(Math.random()*CONFIG.cells.length)];
  }
}
async function submit(status){
  D.status = status;
  D.duration_s = Math.round((Date.now()-T.start)/1000);
  D.blur_count = blurCount;
  D.user_agent = navigator.userAgent;
  D.screen_wh  = screen.width+"x"+screen.height;
  D.viewport_wh= window.innerWidth+"x"+window.innerHeight;
  D.touch      = ('ontouchstart' in window)?1:0;
  D.study = CONFIG.study; D.version = CONFIG.version;
  for(let a=0;a<3;a++){
    try{
      const r = await post(CONFIG.table, { submission_id:SUBMISSION_ID, pid:PID,
        status:status, duration_s:D.duration_s, data:D });
      if(r.ok) return true;
    }catch(e){}
    await new Promise(res=>setTimeout(res, 700*(a+1)));
  }
  logEvent("submit_failed", status);
  return false;
}
window.addEventListener("blur", ()=>{ blurCount++; });
window.addEventListener("pagehide", ()=>{
  if(D.status) return;
  try{
    const fd = new URLSearchParams({ study:CONFIG.study, version:CONFIG.version,
      submission_id:SUBMISSION_ID||"", pid:PID||"", event:"abandon",
      detail:"screen="+(SCREENS[idx]?SCREENS[idx].id:"?") });
    navigator.sendBeacon(CONFIG.supabaseUrl+"/rest/v1/"+CONFIG.events+"?apikey="+CONFIG.supabaseKey,
      new Blob([fd.toString()],{type:"application/x-www-form-urlencoded"}));
  }catch(e){}
});

/* =====================================================================
   STIMULI
   ===================================================================== */
const AVATAR = '<svg viewBox="0 0 24 24"><path d="M12 2a1 1 0 0 1 1 1v1.06a7.01 7.01 0 0 1 5.94 5.94H20a1 1 0 1 1 0 2h-1.06a7.01 7.01 0 0 1-5.94 5.94V19a1 1 0 1 1-2 0v-1.06A7.01 7.01 0 0 1 5.06 12H4a1 1 0 1 1 0-2h1.06A7.01 7.01 0 0 1 11 4.06V3a1 1 0 0 1 1-1Zm0 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg>';

function paras(arr){ return arr.map(x=>"<p>"+x+"</p>").join(""); }

function chatHTML(V, revealed){
  let second = "";
  if(revealed){
    second = `
      <div class="gap"><span>You asked the same question again, a few minutes later</span></div>
      <div class="turn">
        <div class="u-row"><div class="u-bub">${V.q}</div></div>
        <div class="a-row"><div class="a-av">${AVATAR}</div><div class="a-txt">${paras(V.a2)}</div></div>
      </div>`;
  } else {
    second = `
      <div class="askwrap">
        <button class="askbtn" id="askagain" disabled>
          <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:currentColor"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
          See what the AI said the second time
        </button>
      </div>`;
  }
  return `
  <div class="chat">
    <div class="chat-top"><span class="chat-dot"></span><span class="chat-name">AI Assistant</span></div>
    <div class="chat-body">
      <div class="turn">
        <div class="u-row"><div class="u-bub">${V.q}</div></div>
        <div class="a-row"><div class="a-av">${AVATAR}</div><div class="a-txt">${paras(V.a1)}</div></div>
      </div>
      ${second}
    </div>
  </div>`;
}

const VIGNETTES = {

  /* ---- A: SUBSTANTIVE — interpersonal advice ---- */
  A: { key:"A", type:"substantive", domain:"relationship",
    q:"My partner and I keep having the same argument about money every few weeks. Should I bring it up again this weekend, or let it go for now?",
    a1:[
      "I&rsquo;d bring it up &mdash; but change <em>how</em> you bring it up.",
      "Recurring arguments usually repeat because the conversation keeps getting reset rather than resolved. Waiting tends to let resentment build quietly, so the next argument starts from a worse place than the last one did.",
      "Pick a low-stakes moment this weekend and open with the pattern rather than the incident &mdash; something like &ldquo;I&rsquo;ve noticed we keep landing in the same argument, and I don&rsquo;t think either of us likes it.&rdquo; That frames it as a shared problem instead of a complaint.",
      "Try to agree on one concrete thing before the conversation ends: a spending amount you&rsquo;ll check with each other above, or a short monthly money check-in. One small commitment is worth more than a long discussion."
    ],
    a2:[
      "I&rsquo;d hold off this weekend.",
      "If it&rsquo;s come up every few weeks and keeps ending the same way, the problem probably isn&rsquo;t the specific disagreement &mdash; it&rsquo;s that you&rsquo;re both walking into the conversation already braced for it. Raising it again while that&rsquo;s still fresh tends to reproduce the same argument rather than move it.",
      "Give it a couple of weeks without bringing it up. Use that time to get specific with yourself about what actually bothers you: is it the amount, the surprise, or the feeling of not being consulted? Those are three different conversations and they don&rsquo;t have the same fix.",
      "When you do come back to it, you&rsquo;ll be raising something particular rather than reopening a familiar fight &mdash; and that tends to go somewhere."
    ]
  },

  /* ---- B: SUBSTANTIVE — insurance choice ---- */
  B: { key:"B", type:"substantive", domain:"insurance",
    q:"I&rsquo;m 34 and healthy. My job offers a high-deductible health plan with an HSA, or a traditional PPO with higher premiums. Which should I take?",
    a1:[
      "For your situation I&rsquo;d lean toward the <strong>high-deductible plan with the HSA</strong>.",
      "At 34 and in good health, you&rsquo;re statistically unlikely to reach the deductible in a given year, which means the PPO&rsquo;s higher premiums are largely buying coverage you won&rsquo;t use.",
      "The stronger argument is the HSA itself. It&rsquo;s the only account that is tax-free going in, tax-free while it grows, and tax-free coming out for medical costs &mdash; and after 65 it behaves like a traditional retirement account. Anything you don&rsquo;t spend rolls over permanently.",
      "The one thing to check first: whether you have enough cash on hand to absorb the full deductible if something unexpected happens. If you do, the high-deductible plan is usually the better long-run choice."
    ],
    a2:[
      "For your situation I&rsquo;d lean toward the <strong>PPO</strong>.",
      "&ldquo;Healthy at 34&rdquo; describes most people right up until it doesn&rsquo;t, and the high-deductible plan moves that risk onto you. One injury, or a diagnosis that needs a few months of specialist visits, can take you to the full deductible quickly &mdash; and that arrives as a single large bill rather than a predictable monthly cost.",
      "The HSA tax advantages are real, but they only pay off if you can leave the money invested instead of spending it on care. That&rsquo;s a harder condition to meet than it sounds, and most people don&rsquo;t.",
      "The one thing to check first: your out-of-pocket maximum and whether your regular doctors are in network. If the premium difference is modest, the predictability is usually worth paying for."
    ]
  },

  /* ---- C: FORMAL — same advice, different wording ---- */
  C: { key:"C", type:"formal", domain:"fitness",
    q:"I want to start running but I&rsquo;ve never managed to stick with exercise. How should I start?",
    a1:[
      "Start with run-walk intervals rather than trying to run continuously.",
      "Three sessions a week is enough. Try one minute of easy jogging followed by two minutes of walking, repeated for about twenty minutes. As that starts to feel comfortable, extend the running interval and shorten the walking.",
      "Keep the pace slow enough that you could hold a conversation. Most people who quit early do so because they run too hard, not because they run too little.",
      "Don&rsquo;t add a fourth day for at least a month. The habit is the thing you&rsquo;re building right now &mdash; the fitness follows on its own."
    ],
    a2:[
      "Begin by alternating running and walking instead of trying to run the whole way.",
      "Aim for three days a week. A good starting structure is jogging gently for a minute, then walking for two, cycling through that for roughly twenty minutes. Once it stops feeling hard, stretch out the jogging portion and trim the walking.",
      "Run slowly &mdash; slow enough to talk while you&rsquo;re doing it. Going out too fast is the usual reason people give up, far more often than not doing enough.",
      "Hold off on a fourth session for the first month or so. What you&rsquo;re establishing right now is the routine; the fitness takes care of itself."
    ]
  }
};

const AGREE = ["Strongly<br>disagree","Disagree","Somewhat<br>disagree","Neither","Somewhat<br>agree","Agree","Strongly<br>agree"];

/* =====================================================================
   RENDER HELPERS
   ===================================================================== */
const app = document.getElementById("app");
function likert(name){
  let h = '<div class="lik">';
  for(let i=1;i<=7;i++) h += `<label><input type="radio" name="${name}" value="${i}"><span class="n">${i}</span></label>`;
  h += '</div><div class="anchors"><span>1 &nbsp;Strongly disagree</span><span>Strongly agree&nbsp; 7</span></div>';
  return h;
}
function radios(name, opts){
  return '<div class="opts">' + opts.map((o,i)=>
    `<label class="opt" data-g="${name}"><input type="radio" name="${name}" value="${o.v}">${o.t}</label>`).join('') + '</div>';
}
function checks(name, opts){
  return '<div class="opts">' + opts.map((o,i)=>
    `<label class="opt" data-g="${name}"><input type="checkbox" name="${name}" value="${o.v}">${o.t}</label>`).join('') + '</div>';
}
function wire(){
  app.querySelectorAll('.opt input').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const g = inp.closest('.opt').dataset.g;
      if(inp.type==='radio') app.querySelectorAll(`.opt[data-g="${g}"]`).forEach(l=>l.classList.remove('sel'));
      inp.closest('.opt').classList.toggle('sel', inp.checked);
    });
  });
}
function q(n, text){ return `<div class="qtext"><span class="qnum">${n}</span>${text}</div>`; }

function show(html, onNext, opts){
  opts = opts || {};
  T.screenStart = Date.now();
  const wr = document.querySelector(".wrap"); if(wr) wr.classList.remove("wide");
  app.innerHTML = html + (opts.noBtn ? '' :
    `<div class="btn-row"><button class="btn" id="next">${opts.label||"Continue"}</button></div>
     <div class="err" id="err">${opts.err||"Please answer every question before continuing."}</div>`);
  document.getElementById("bar").style.width = Math.round((idx/SCREENS.length)*100)+"%";
  window.scrollTo(0,0);
  wire();
  const b = document.getElementById("next");
  if(b) b.onclick = ()=>{
    const ok = onNext ? onNext() : true;
    if(ok===false){ const e=document.getElementById("err"); if(e) e.classList.add("show"); return; }
    const sid = SCREENS[idx] ? SCREENS[idx].id : ("s"+idx);
    D["t_"+sid+"_ms"] = Date.now()-T.screenStart;
    idx++; runScreen();
  };
}
const val  = n => { const e = app.querySelector(`input[name="${n}"]:checked`); return e ? e.value : null; };
const vals = n => Array.from(app.querySelectorAll(`input[name="${n}"]:checked`)).map(e=>e.value);
function need(names){ for(const n of names){ if(!val(n)) return false; } return true; }

function scrVignette(k, pos){
  const V = VIGNETTES[k];

  // Identical five questions on every vignette, same order, every time.
  // Manipulation check last, after the dependent measures.
  const QS = [
    // --- focal DV: warrant collapse (3 indicators) ---
    { id:"ADJ1", kind:"lik", t:"I would have no way of telling which of these two answers to follow." },
    { id:"ADJ2", kind:"lik", t:"If I had to act on one of these answers, the choice would feel arbitrary." },
    { id:"ADJ3", kind:"lik", t:"I would be stuck deciding what to actually do here." },
    // --- equal-defensibility check (discriminant hinge vs Yang et al.) ---
    { id:"DEF",  kind:"lik", t:"One of these answers is clearly better advice than the other." },
    // --- accuracy channel (the dissociation) ---
    { id:"ACC1", kind:"lik", t:"What the AI said here is accurate." },
    { id:"ACC2", kind:"lik", t:"I am confident that good information is somewhere in these two answers." },
    // --- verification futility (the mediator), reverse-scored ---
    { id:"FUT",  kind:"lik", t:"Asking the AI the same question again would help me work out which answer to go with." },
    // --- trust (the Posner comparison) ---
    { id:"TRUST",kind:"lik", t:"I would trust this AI to help me with a decision like this." },
    // --- behaviour ---
    { id:"NEXT", kind:"rad", t:"If this were your question, what would you most likely do next?",
      opts:[{v:"follow",t:"Follow one of the two answers"},{v:"again",t:"Ask the AI again"},
            {v:"nonai",t:"Look it up somewhere that isn&rsquo;t AI"},{v:"person",t:"Ask someone I know"},
            {v:"drop",t:"Leave the decision for now"}] },
    // --- manipulation check, last ---
    { id:"MC",   kind:"lik", t:"Both times, the AI gave essentially the same advice." }
  ];
  const REVEAL_CHUNK = 3;   // set to 1 to go back to strictly one question at a time
  const CHUNKS = [];
  for(let i=0;i<QS.length;i+=REVEAL_CHUNK) CHUNKS.push(QS.slice(i,i+REVEAL_CHUNK).map((_,j)=>i+j));

  const qBody = QS.map((qq,i)=>
    `<div class="q qhide" id="q_${i}">${q((i+1)+" of "+QS.length+".", qq.t)}` +
    (qq.kind==="lik" ? likert(qq.id) : radios(qq.id, qq.opts)) + `</div>`).join("");

  T.screenStart = Date.now();
  document.querySelector(".wrap").classList.add("wide");
  app.innerHTML =
    `<div class="vhead"><div class="kicker">Conversation ${pos} of 3</div></div>
     <div class="vsplit">
       <div class="vleft" id="vleft">${chatHTML(V, false)}</div>
       <div class="vright" id="vright">
         <div class="waiting" id="waiting">Read the answer on the left. When you are ready, use the button underneath it to see what the AI said the second time &mdash; the questions will appear here.</div>
         <div id="qzone">${qBody}</div>
         <div class="btn-row qhide" id="btnrow"><button class="btn" id="next">Continue</button></div>
       </div>
     </div>`;
  document.getElementById("bar").style.width = Math.round((idx/SCREENS.length)*100)+"%";
  window.scrollTo(0,0);

  const revealedAt = {}, answeredAt = {};
  let shown = -1;
  const tEnter = Date.now();

  /* --- gate 1: the "ask again" button unlocks after a short read window --- */
  const READ1_MS = 5000, READ2_MS = 4500;
  const askBtn = document.getElementById("askagain");
  setTimeout(()=>{ const b=document.getElementById("askagain"); if(b) b.disabled = false; }, READ1_MS);

  function answered(i){ return !!document.querySelector(`input[name="${QS[i].id}"]:checked`); }
  function chunkDone(c){ return CHUNKS[c].every(i=>answered(i)); }
  function reveal(c){
    if(c>=CHUNKS.length){
      const br=document.getElementById("btnrow");
      br.classList.remove("qhide"); br.classList.add("qshow");
      br.scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }
    shown = c;
    CHUNKS[c].forEach(i=>{
      const el = document.getElementById("q_"+i);
      el.classList.remove("qhide"); el.classList.add("qshow");
      revealedAt[QS[i].id] = Date.now();
    });
    if(c>0) document.getElementById("q_"+CHUNKS[c][0]).scrollIntoView({behavior:"smooth", block:"center"});
    // Self-heal: if this chunk arrives already complete (restored form state, very fast
    // input, assistive tech), no further change event will fire for it — advance anyway,
    // otherwise the participant is stranded with no Continue button.
    if(chunkDone(c)) setTimeout(()=>reveal(c+1), 260);
  }

  document.getElementById("qzone").addEventListener("change",(ev)=>{
    const nm = ev.target && ev.target.name; if(!nm) return;
    const i = QS.findIndex(x=>x.id===nm); if(i<0) return;
    if(!answeredAt[nm]) answeredAt[nm] = Date.now();
    if(shown>=0 && CHUNKS[shown].includes(i) && chunkDone(shown)) setTimeout(()=>reveal(shown+1), 260);
    // Backstop: everything answered means the Continue button must be reachable,
    // whatever order the answers arrived in.
    if(QS.every((_,j)=>answered(j))){
      QS.forEach((_,j)=>{ const el=document.getElementById("q_"+j);
        el.classList.remove("qhide"); el.classList.add("qshow"); });
      const br=document.getElementById("btnrow");
      br.classList.remove("qhide"); br.classList.add("qshow");
    }
  });

  /* --- gate 2: revealing the second answer, then the questions --- */
  if(askBtn){
    askBtn.addEventListener("click", ()=>{
      D["v"+k+"_t_to_ask_ms"] = Date.now()-tEnter;
      document.getElementById("vleft").innerHTML = chatHTML(V, true);
      const w = document.getElementById("waiting");
      if(w) w.textContent = "Take a moment to read the second answer. The first question will appear here shortly.";
      const gap = document.querySelectorAll("#vleft .gap");
      if(gap.length) gap[gap.length-1].scrollIntoView({behavior:"smooth", block:"center"});
      setTimeout(()=>{
        const w2 = document.getElementById("waiting"); if(w2) w2.remove();
        wire();                       // option highlighting for the radio block
        reveal(0);
      }, READ2_MS);
    });
  }

  document.getElementById("next").onclick = ()=>{
    if(!need(QS.map(x=>x.id))) return;
    D["v"+k+"_type"]   = V.type;
    D["v"+k+"_domain"] = V.domain;
    D["v"+k+"_pos"]    = pos;
    QS.forEach(qq=>{
      const v = val(qq.id);
      D["v"+k+"_"+qq.id] = (qq.kind==="lik") ? +v : v;
      if(revealedAt[qq.id] && answeredAt[qq.id])
        D["v"+k+"_"+qq.id+"_ms"] = answeredAt[qq.id]-revealedAt[qq.id];
    });
    D["t_vig_"+k+"_ms"] = Date.now()-T.screenStart;
    document.querySelector(".wrap").classList.remove("wide");
    idx++; runScreen();
  };
}

async function scrDone(){
  app.innerHTML = `<div class="card center"><h1>Submitting your responses&hellip;</h1><p class="muted">Please do not close this window.</p></div>`;
  document.getElementById("bar").style.width = "100%";
  const ok = await submit("complete");
  window.scrollTo(0,0);

  if(!ok){
    // Never bounce someone to Prolific when their data did not save.
    app.innerHTML = `
      <div class="card">
        <div class="kicker" style="color:var(--warn)">Could not save</div>
        <h1>We couldn&rsquo;t save your responses</h1>
        <p class="lead">Your answers may not have been recorded. Please do not close this window yet.</p>
        <p>Copy the completion code below into Prolific so you are paid, and message the researchers through the platform to let them know this message appeared.</p>
        <p class="center" style="margin:22px 0"><code class="cc">${CONFIG.completionCode}</code></p>
        <p class="center"><a class="btn" style="text-decoration:none;display:inline-block"
           href="${CONFIG.prolificReturnUrl}">Return to Prolific</a></p>
      </div>`;
    logEvent("done_no_save");
    return;
  }

  logEvent("complete");
  const secs = Math.round(CONFIG.redirectDelayMs/1000);
  app.innerHTML = `
    <div class="card">
      <div class="kicker">Complete</div>
      <h1>Thank you &mdash; you&rsquo;re finished</h1>
      <p class="lead">Your responses have been recorded.</p>

      <h2>What this study was about</h2>
      <p>We are studying how people respond when an AI assistant gives more than one answer to the same question. In two of the conversations you saw, the AI gave genuinely <em>different</em> advice the second time. In the third, it gave the <em>same</em> advice in different words. We are interested in whether those feel different to people, and in particular whether the second kind leaves you without any basis for choosing.</p>
      <p><strong>The conversations you read were written by the research team for this study.</strong> They are not transcripts of real conversations, and nothing in them should be taken as advice about relationships, insurance, or exercise.</p>

      <h2>Returning to Prolific</h2>
      <p>You will be returned to Prolific automatically in <strong id="cd">${secs}</strong> seconds. If nothing happens, use the button below.</p>
      <p class="center" style="margin:20px 0">
        <a class="btn" id="goback" style="text-decoration:none;display:inline-block"
           href="${CONFIG.prolificReturnUrl}">Finish and return to Prolific</a>
      </p>
      <p class="muted center">If the button does not work, your completion code is <code class="cc" style="font-size:15px;padding:5px 12px">${CONFIG.completionCode}</code></p>
    </div>`;

  // Wall-clock, not tick-counting: browsers throttle timers in background tabs, and a
  // participant who switches to Prolific mid-countdown must still be returned on time.
  const deadline = Date.now() + CONFIG.redirectDelayMs;
  const tick = setInterval(()=>{
    const left = Math.max(0, Math.ceil((deadline - Date.now())/1000));
    const el = document.getElementById("cd");
    if(el) el.textContent = left;
    if(left<=0){ clearInterval(tick); window.location.replace(CONFIG.prolificReturnUrl); }
  }, 500);
  const b = document.getElementById("goback");
  if(b) b.addEventListener("click", ()=>{ clearInterval(tick); });
}

/* =====================================================================
   FLOW
   ===================================================================== */
function runScreen(){
  if(idx >= SCREENS.length) return;
  SCREENS[idx].fn();
}

async function boot(){
  SUBMISSION_ID = uuid();
  D.submission_id = SUBMISSION_ID;
  RNG = mulberry32(hashStr(SUBMISSION_ID)());

  // counterbalanced block order, server-balanced
  const cell = await assignCell();
  D.block_order = cell; D.cond_cell = cell;

  const vOrder = shuffle(["A","B","C"]);
  D.vignette_order = vOrder.join(",");

  const vignetteBlock = [
    { id:"vig_intro", fn:scrVigIntro },
    ...vOrder.map((k,i)=>({ id:"vig_"+k, fn:()=>scrVignette(k, i+1) }))
  ];
  const beliefBlock = [ { id:"beliefs", fn:scrBeliefs } ];

  SCREENS = [
    { id:"device",  fn:scrDevice },
    { id:"consent", fn:scrConsent },
    { id:"screen1", fn:scrScreen1 },
    ...(cell==="vignettes_first" ? [...vignetteBlock, ...beliefBlock]
                                 : [...beliefBlock, ...vignetteBlock]),
    { id:"humanai",    fn:scrHumanAI },
    { id:"exp_intro",  fn:scrExpIntro },
    { id:"exp_detail", fn:scrExpDetail },
    { id:"compare",    fn:scrCompare },
    { id:"boundary",   fn:scrBoundary },
    { id:"demo",       fn:scrDemo },
    { id:"done",       fn:scrDone }
  ];
  logEvent("start", cell);
  runScreen();
}
boot();
